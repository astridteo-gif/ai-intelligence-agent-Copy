
name: Daily AI Intelligence

on:
  schedule:
    - cron: '45 7 * * *'
      timezone: 'America/New_York'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect AI and technology news
        run: python collector.py

      - name: Generate morning briefing
        run: python briefing.py

      - name: Upload daily briefing
        uses: actions/upload-artifact@v4
        with:
          name: ai-morning-brief
          path: |
            news.json
            briefing.txt
          retention-days: 30
          if-no-files-found: error

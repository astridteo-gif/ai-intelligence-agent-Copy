
name: Daily AI Intelligence

on:
  schedule:
    - cron: '45 7 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect AI and technology news
        run: python collector.py

      - name: Generate morning briefing
        run: python briefing.py

      - name: Upload daily briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-morning-brief
          path: |
            news.json
            briefing.txt
          retention-days: 30

      - name: Publish briefing to GitHub Pages
        run: |
          mkdir -p docs
          cp briefing.txt docs/briefing.txt
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/briefing.txt docs/.nojekyll
          git diff --cached --quiet || git commit -m "Update daily briefing"
          git push
